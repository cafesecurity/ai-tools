name: youtube-mcp

on:
  push:
    paths: ['youtube-mcp/**', '.github/workflows/youtube-mcp.yml']
  pull_request:
    paths: ['youtube-mcp/**', '.github/workflows/youtube-mcp.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: youtube-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Secret scan
        run: scripts/secret-scan.sh
      - name: Install (npm 11, install scripts blocked except allowScripts)
        run: npx -y npm@11 ci
      - name: Audit runtime dependencies
        run: npx -y npm@11 audit --omit=dev --audit-level=moderate
      - name: Typecheck, unit and end-to-end tests
        run: npm run check
